---
 - name: Get Service State
   hosts: win
   gather_facts: no

   # See apply_windows_updates.yml - winrm + fork() on macOS kills the workers.
   pre_tasks:
   - name: Fail fast if the macOS fork-safety workaround is missing
     assert:
       that: lookup('env', 'OBJC_DISABLE_INITIALIZE_FORK_SAFETY') | length > 0
       fail_msg: "OBJC_DISABLE_INITIALIZE_FORK_SAFETY is not set - add it to ~/.bashrc and open a new terminal."
     delegate_to: localhost
     run_once: true
     when: lookup('pipe', 'uname') == 'Darwin'
     tags: [always]

   tasks:
   - name: Get Service Facts
     ansible.windows.win_service_info:

#   - name: Parallels State 
#     ansible.builtin.debug:
#       var: ansible_facts.services["twingate-connector.service"].state
#     tags:
#     - parallels 

   - name: Gather Qemu State
     ansible.windows.win_service_info:
       name: QEMU.GA
     register: qemu
     tags:
     - qemu
     
   - name: Print Qemu State
     debug:
       var: qemu
     tags:
     - qemu

   - name: Gather Parallels State
     ansible.windows.win_service_info:
       name: RAS*
     register: ras
     tags:
     - ras
     - parallels

   - name: Print Parallels State
     debug:
       var: ras.services[0].state
     tags:
     - ras
     - parallels
