---
# DESCRIPTION
# Apply Windows Updates
# Author: Shamelessly based on the Windows update playbook from u/zoredache on r/ansible

# ── REBOOTS ───────────────────────────────────────────────────────────────────
# NOTHING here reboots a host unless you explicitly ask for it.
#
#   --tags reboot          reboot hosts that have a reboot already pending
#   -e reboot_after=true   install and reboot in one pass (old behaviour)
#
# Windows cumulative updates usually cannot finish applying without a restart,
# so the normal sequence is:
#   --tags upgrade   ->   --tags reboot   ->   --tags upgrade
# The second pass finishes anything that was staged for the restart.

# ── UPDATE CATEGORIES, IN PLAIN ENGLISH ───────────────────────────────────────
#   SecurityUpdates    Fixes for security vulnerabilities. The monthly
#                      cumulative update lands here. The reason you patch.
#   CriticalUpdates    Non-security fixes for serious bugs (crashes, data loss).
#   UpdateRollups      Bundles of previously-released hotfixes for a component.
#   DefinitionUpdates  Defender antivirus signatures. Daily, tiny, no reboot.
#                      Data, not code - the freshclam of the Windows world.
#   Drivers            Hardware drivers. On a HyperCore VM this includes the
#                      virtio storage and network drivers, so swapping them
#                      under a running guest deserves a maintenance window.
#   Upgrades           A WHOLE OS VERSION JUMP, e.g. Win11 24H2 -> 25H2. This
#                      is do-release-upgrade, NOT apt upgrade. Takes 20-45 min,
#                      reboots several times, and is not routine patching.
#
# The 'upgrade' tag deliberately EXCLUDES Drivers and Upgrades. Use the
# 'feature-upgrade' tag when you actually want those, on a day you are watching.

# Usage:
# Check for available updates and reboot status:
#   ansible-playbook windows/apply_windows_updates.yml --tags check -i windows/win_inventory
# List available updates by category:
#   ansible-playbook windows/apply_windows_updates.yml --tags list -i windows/win_inventory
# Routine patching (security + critical + rollups + definitions, NO reboot):
#   ansible-playbook windows/apply_windows_updates.yml --tags upgrade -i windows/win_inventory
# Security updates only:
#   ansible-playbook windows/apply_windows_updates.yml --tags security -i windows/win_inventory
# Critical updates only:
#   ansible-playbook windows/apply_windows_updates.yml --tags critical -i windows/win_inventory
# Update rollups only:
#   ansible-playbook windows/apply_windows_updates.yml --tags rollup -i windows/win_inventory
# OS version upgrades and drivers (deliberate, slow, reboots a lot):
#   ansible-playbook windows/apply_windows_updates.yml --tags feature-upgrade -i windows/win_inventory
# Check if a reboot is pending (no update search):
#   ansible-playbook windows/apply_windows_updates.yml --tags reboot-check -i windows/win_inventory
# Reboot hosts with a pending reboot:
#   ansible-playbook windows/apply_windows_updates.yml --tags reboot -i windows/win_inventory
# Limit to specific hosts or groups: add -l 'hostname' or -l 'win:!dc01'


- name: Apply Windows Updates
  hosts: win
  gather_facts: no

  vars:
    # Reboots are opt-in. Override with -e reboot_after=true to install and
    # restart in a single pass.
    reboot_after: false
    # 1 hour. A Server 2019 cumulative can spend 20+ minutes in the servicing
    # phase at boot, and a feature upgrade far longer. Interrupting that is
    # genuinely dangerous, so wait rather than give up.
    reboot_wait: 3600

  # On a macOS controller, Ansible forks a worker per host and the winrm
  # connection plugin pulls in _scproxy/CoreFoundation, which the Obj-C runtime
  # refuses to initialise in a fork child. The worker dies with SIGABRT and
  # Ansible reports only "A worker was found in a dead state" alongside a crash
  # report. Fail with something readable instead.
  pre_tasks:
  - name: Fail fast if the macOS fork-safety workaround is missing
    assert:
      that: lookup('env', 'OBJC_DISABLE_INITIALIZE_FORK_SAFETY') | length > 0
      fail_msg: |
        OBJC_DISABLE_INITIALIZE_FORK_SAFETY is not set in this shell.
        Without it every worker crashes on macOS ("A worker was found in a dead state").
        Add to ~/.bashrc (VS Code terminals are non-login bash, so .bash_profile is NOT read):
          export OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES
        then open a new terminal. One-off workaround:
          OBJC_DISABLE_INITIALIZE_FORK_SAFETY=YES ansible-playbook ...
      success_msg: "fork-safety workaround present"
    delegate_to: localhost
    run_once: true
    when: lookup('pipe', 'uname') == 'Darwin'
    tags: [always]

  tasks:

  # ── Check / List ──────────────────────────────────────────────────────────

  - name: Search for available updates
    ansible.windows.win_updates:
      state: searched
    register: available_updates
    tags:
    - check
    - list

  - name: Show available updates
    debug:
      var: available_updates.updates
    tags:
    - check
    - list

  - name: Show update count and reboot status
    debug:
      msg: "Found {{ available_updates.found_update_count }} update(s). Reboot required: {{ available_updates.reboot_required }}"
    tags:
    - check
    - list

  # ── Reboot check (registry only, no update search) ───────────────────────

  - name: Check for pending reboot (registry)
    ansible.windows.win_reg_stat:
      path: HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired
    register: reboot_registry
    tags:
    - reboot-check
    - reboot

  - name: Reboot required?
    debug:
      msg: "Reboot Required"
    when: reboot_registry.exists
    tags:
    - reboot-check
    - reboot

  # ── Routine patching ──────────────────────────────────────────────────────
  # Everything you want applied on a schedule. Deliberately excludes Drivers
  # and Upgrades - see the category notes at the top of this file.

  - name: Install routine updates
    ansible.windows.win_updates:
      category_names:
      - SecurityUpdates
      - CriticalUpdates
      - UpdateRollups
      - DefinitionUpdates
      state: installed
      reboot: "{{ reboot_after | bool }}"
      reboot_timeout: "{{ reboot_wait }}"
    register: upgrade_results
    tags:
    - upgrade

  - name: Show routine update results
    debug:
      msg: >-
        Installed {{ upgrade_results.installed_update_count }} update(s).
        {{ 'REBOOT PENDING - run --tags reboot to finish applying them.'
           if upgrade_results.reboot_required else 'No reboot needed.' }}
    tags:
    - upgrade

  # ── Security updates ──────────────────────────────────────────────────────

  - name: Install security updates
    ansible.windows.win_updates:
      category_names:
      - SecurityUpdates
      state: installed
      reboot: "{{ reboot_after | bool }}"
      reboot_timeout: "{{ reboot_wait }}"
    register: security_results
    tags:
    - security

  - name: Show security update results
    debug:
      msg: >-
        Installed {{ security_results.installed_update_count }} security update(s).
        {{ 'REBOOT PENDING - run --tags reboot.' if security_results.reboot_required else 'No reboot needed.' }}
    tags:
    - security

  # ── Critical updates ──────────────────────────────────────────────────────

  - name: Install critical updates
    ansible.windows.win_updates:
      category_names:
      - CriticalUpdates
      state: installed
      reboot: "{{ reboot_after | bool }}"
      reboot_timeout: "{{ reboot_wait }}"
    register: critical_results
    tags:
    - critical

  - name: Show critical update results
    debug:
      msg: >-
        Installed {{ critical_results.installed_update_count }} critical update(s).
        {{ 'REBOOT PENDING - run --tags reboot.' if critical_results.reboot_required else 'No reboot needed.' }}
    tags:
    - critical

  # ── Update rollups ────────────────────────────────────────────────────────

  - name: Install update rollups
    ansible.windows.win_updates:
      category_names:
      - UpdateRollups
      state: installed
      reboot: "{{ reboot_after | bool }}"
      reboot_timeout: "{{ reboot_wait }}"
    register: rollup_results
    tags:
    - rollup

  - name: Show rollup results
    debug:
      msg: >-
        Installed {{ rollup_results.installed_update_count }} rollup(s).
        {{ 'REBOOT PENDING - run --tags reboot.' if rollup_results.reboot_required else 'No reboot needed.' }}
    tags:
    - rollup

  # ── OS version upgrades and drivers ───────────────────────────────────────
  # NOT routine. 'Upgrades' is a whole OS version jump (do-release-upgrade),
  # and 'Drivers' on a HyperCore VM means swapping virtio storage/network
  # drivers under a running guest. Both want a maintenance window and someone
  # watching. Expect 20-45 minutes and multiple restarts.

  - name: Install OS version upgrades and drivers
    ansible.windows.win_updates:
      category_names:
      - Upgrades
      - Drivers
      state: installed
      reboot: "{{ reboot_after | bool }}"
      reboot_timeout: "{{ reboot_wait }}"
    register: feature_results
    tags:
    - feature-upgrade

  - name: Show feature upgrade results
    debug:
      msg: >-
        Installed {{ feature_results.installed_update_count }} upgrade(s)/driver(s).
        {{ 'REBOOT PENDING - run --tags reboot. A feature upgrade may reboot several times.'
           if feature_results.reboot_required else 'No reboot needed.' }}
    tags:
    - feature-upgrade

  # ── Reboot ────────────────────────────────────────────────────────────────
  # The only task that restarts anything.

  - name: Reboot if pending
    ansible.windows.win_reboot:
      reboot_timeout: "{{ reboot_wait }}"
    when: reboot_registry.exists
    tags:
    - reboot
