---
# DESCRIPTION
# Install Docker Engine + Compose plugin on Ubuntu Servers from Docker's official repo
# Uses a signed-by keyring (apt-key is gone on newer Ubuntu) and the host's own release codename
# Based on: https://markontech.com/posts/install-docker-using-ansible/ (Marko Nisic)
#           https://docs.docker.com/engine/install/ubuntu/

- name: Installing Docker Engine
  hosts: apt
  become: yes
  tasks:
    - name: Install required system packages
      apt:
        name:
          - ca-certificates
          - curl
        state: present
        update_cache: true

    - name: Create apt keyrings directory
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Download Docker GPG key
      get_url:
        url: https://download.docker.com/linux/ubuntu/gpg
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker Repository
      apt_repository:
        repo: "deb [arch={{ 'arm64' if ansible_architecture == 'aarch64' else 'amd64' }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_distribution_release }} stable"
        filename: docker
        state: present

    - name: Update apt and install Docker packages
      apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Ensure Docker is started and enabled
      service:
        name: docker
        state: started
        enabled: true

    - name: Add user to the Docker group
      user:
        name: "{{ ansible_user | default('alex') }}"
        groups: docker
        append: yes
