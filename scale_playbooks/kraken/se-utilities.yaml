---
# Fleet Manager / Kraken Applications manifest
# Deploys five small Ubuntu 24.04 VMs used as SE utility boxes. Current job is
# generating synthetic storage load with fio (see ../../fio_load.yml), which
# runs as a systemd service so it survives reboots and patch windows.
#
# Docs: https://scalecomputing.github.io/kraken-applications/
#
# Deploy via the Fleet Manager UI (upload/paste this manifest), or via the
# Kraken API/CLI if you have one set up.
#
# Sizing rationale:
#   cpu 2      - fio at these rates is I/O wait, not compute; 2 keeps the
#                loader from ever becoming the bottleneck.
#   memory 2G  - kept deliberately small. fio uses direct=1 so the guest page
#                cache is bypassed anyway, and a small guest cannot cache the
#                working set, which keeps the I/O reaching the cluster.
#   disk 50G   - 16 GB fio working set (size=8G x numjobs=2) + Ubuntu root,
#                with headroom. Matches the base image, so no resize needed.
#
# NOTE: the virdomain spec has no node affinity/placement field, so HyperCore
# chooses placement. After deploy, confirm the five VMs actually landed on five
# different nodes and move any that doubled up, otherwise some node gauges will
# stay flat.
#
# Before deploying: set a real password below (or drop chpasswd entirely and
# rely on the SSH key). Do NOT commit a real plaintext password.

type: Application
version: "1"
metadata:
  name: se-utilities
  labels:
    - "project:se-utilities"

spec:
  assets:
    # Shared base image - referenced by all five VMs below.
    # "raw" is the only supported non-ISO format today.
    - name: ubuntu-24-04
      type: virtual_disk
      format: raw
      url: https://storage.googleapis.com/demo-bucket-lfm/ubuntu-24.04-qga-qemu.img

  resources:
    - name: ScaleDemo.SEUtil1
      type: virdomain
      spec:
        description: SE utility box - fio storage load generator
        cpu: 2
        memory: "2 GiB"
        machine_type: uefi
        os: other
        state: running
        tags:
          - zSE_Utilities

        storage_devices:
          - name: root-disk
            type: virtio_disk
            source: ubuntu-24-04
            boot: 1
            capacity: "50 GB"

        network_devices:
          - name: eth0
            type: virtio
            vlan: 0

        cloud_init_data:
          user_data: |
            #cloud-config
            hostname: se-util1
            package_update: true
            packages:
              - qemu-guest-agent
              - fio
              - curl

            users:
              - name: alex
                groups: sudo
                shell: /bin/bash
                sudo: ALL=(ALL) NOPASSWD:ALL
                lock_passwd: false
                ssh_authorized_keys:
                  - ssh-rsa  anicholson@AN.local

            # Fill in locally, do NOT commit a real value here (plaintext).
            # Prefer a pre-hashed password (e.g. `mkpasswd --method=SHA-512`)
            # over type: text if this file might ever hit git history.
            chpasswd:
              expire: false
              users:
                - name: alex
                  password: CHANGE_ME
                  type: text

            ssh_pwauth: true

            runcmd:
              - systemctl enable --now qemu-guest-agent
              # All five VMs are clones of one raw image and therefore share
              # /etc/machine-id. systemd-networkd derives its DHCP client
              # identifier (DUID) from that, so every clone asks for a lease
              # under the same identity and the server hands them all the same
              # address - unique MACs make no difference. Pinning the client
              # identifier to the MAC gives each VM its own lease.
              - |
                IFACE=$(ls /sys/class/net | grep -E '^(en|eth)' | head -1)
                cat > /etc/netplan/99-dhcp-identifier.yaml <<EOF
                network:
                  version: 2
                  ethernets:
                    ${IFACE}:
                      dhcp4: true
                      dhcp-identifier: mac
                EOF
                chmod 600 /etc/netplan/99-dhcp-identifier.yaml
                netplan apply

          meta_data: |
            instance-id: se_util1
            local-hostname: se-util1

